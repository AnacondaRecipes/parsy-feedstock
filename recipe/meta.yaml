{% set name = "parsy" %}
{% set version = "2.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/parsy-{{ version }}.tar.gz
  sha256: fd5dd18d7b0b61f8275ee88665f430a20c02cf5a82d88557f35330530186d7ac

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=42
    - wheel
  run:
    - python

test:
  imports:
    - parsy
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/python-parsy/parsy
  summary: easy-to-use parser combinators, for parsing in pure Python
  description: |
    Parsy is an easy-to-use library for writing parser combinators in pure Python.
    It lets you build parsers from small, composable pieces and is suitable for
    parsing structured text and lightweight domain-specific languages.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://parsy.readthedocs.io
  dev_url: https://github.com/python-parsy/parsy

extra:
  recipe-maintainers:
    - cpcloud
    - gforsyth
